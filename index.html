<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Digital</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="estilos.css" />
  
</head>
<body>

  <div class="tira-promos">PRECIOS IMPERDIBLES</div>

  <section class="promos">
    
    <div class="promos-contenedor">

        <a href="" class="promo">
            <div class="promo-info">
                <p class="promo-descripcion">Hamburguesa clásica + Papas fritas + Bebida</p>
                <div class="promo-precio">$4.000</div>
            </div>
            <div class="promo-imagen-contenedor">
                <img src="imagenes/test.png" alt="Promo 1">
            </div>
        </a>

        <a href="" class="promo">
            <div class="promo-info">
                <p class="promo-descripcion">Milanesa de pollo + Papas fritas</p>
                <div class="promo-precio">$5.000</div>
            </div>
            <div class="promo-imagen-contenedor">
                <img src="imagenes/test2.png" alt="Promo 1">
            </div>
        </a>

        <a href="" class="promo">
            <div class="promo-info">
                <p class="promo-descripcion">Porción de pizza por unidad</p>
                <div class="promo-precio">$1.500</div>
            </div>
            <div class="promo-imagen-contenedor">
                <img src="imagenes/test3.png" alt="Promo 1">
            </div>
        </a>

        <a href="" class="promo">
            <div class="promo-info">
                <p class="promo-descripcion">Milanesa napolitana + Papas fritas</p>
                <div class="promo-precio">$7.500</div>
            </div>
            <div class="promo-imagen-contenedor">
                <img src="imagenes/test4.png" alt="Promo 1">
            </div>
        </a>

    </div>

    <div class="promos-indicadores"></div>

  </section>

  <section class="botones">

    <div class="botones-primarios">
    
        <a href="" class="boton">
            <div class="boton-imagen-contenedor">
                <img src="test.png" alt="Boton 1">
            </div>
            <span class="boton-texto">Boton 1</span>
        </a>
        
    </div>

    <div class="botones-secundarios">

        <a href="" class="boton">
            <div class="boton-imagen-contenedor">
                <img src="test.png" alt="Boton 2">
            </div>
            <span class="boton-texto">Boton 2</span>
        </a>

    </div>
  </section>

  <section class="servicios">

    <div class="servicios-contenedor">

        <a href="" class="servicio">
            <div class="servicio-imagen-contenedor">
                <img src="test.png" alt="Servicio 1">
            </div>
            <p class="servicio-descripcion">Servicio de impresión</p>
        </a>

    </div>
    
  </section>
  <script src="script.js"></script>
</body>
</html>
